name: Deploy Staging (Backend)

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-backend-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 与 deploy-prod.yml 同步：冷构建远超 30 分钟，30min 会在拉基础镜像时被切断，
    # 且切断时旧容器已停、新容器未起 = 环境宕机。command_timeout 须 < timeout-minutes。
    timeout-minutes: 120

    steps:
      - name: Trigger deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST_STAGING }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_STAGING }}
          command_timeout: 115m
          script: |
            set -e
            REPO_DIR=/www/wwwroot/api.dongjiaoshan.com
            COMPOSE="docker compose -f script/docker/docker-compose.deploy.yml"

            cd "$REPO_DIR"
            [ -f .env ] || { echo "ERROR: .env missing" >&2; exit 1; }

            echo "==> Pulling latest staging branch"
            git fetch origin staging
            git reset --hard origin/staging

            # 构建期间**不停旧容器** —— 停机时长从「整个构建时长」降到「应用启动时间」(~60s)。
            # 更重要：`set -e` 下构建失败会直接退出，旧容器原封不动继续服务，
            # 不再出现「构建挂了顺带把环境带走」（2026-08-05 prod 宕机 1h40m 就是这么来的）。
            #
            # 原先要先 stop 是因为 4GB 内存怕不够（脚本原注释 "free memory for Maven build"）。
            # 实测：应用容器仅占 ~900MB，available ~1.7GB，而 Maven -Xmx1g 加 JVM 开销约需 1.3-1.5GB
            # —— 够用但无余量，且这台机器 swap=0（内存触顶即 OOM Kill，无缓冲）。
            # 因此下面用 nice -n 19 压低构建优先级，并在构建前后打印内存水位便于复盘。
            # 若日后出现 OOM，优先加 swap 或降 MAVEN_OPTS 堆，不要退回「先 stop」。
            echo "==> Memory before build"
            free -m | head -2

            echo "==> Building new image (old container keeps serving)"
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            nice -n 19 env DEPLOY_ENV=staging $COMPOSE build ruoyi-admin

            echo "==> Memory after build"
            free -m | head -2

            # 镜像 ID 变了，up -d 会自动重建容器（stop 旧 + start 新），无需显式 stop
            echo "==> Switching to new container"
            DEPLOY_ENV=staging $COMPOSE up -d ruoyi-admin

            echo "==> Brief wait for app to settle (60s)..."
            sleep 60

            echo "==> Best-effort smoke test (does NOT fail the deploy):"
            # 连接到端口就算"上线"，HTTP 状态码不卡判定（可能 200/404/503，都说明进程在跑）
            for i in $(seq 1 12); do
              if curl -s -o /dev/null --max-time 3 http://127.0.0.1:8080/; then
                echo "✅ Port 8080 responding at attempt $i"
                break
              fi
              echo "[$i] port not responding yet"
              sleep 5
            done

            # ruoyi 的 sys_dict 缓存无 TTL，只在 admin 改字典时主动 evict；Flyway 直接改 sys_dict_data
            # 绕过缓存失效 → 重启后 Redis 仍返旧字典快照（典型：品种/品系码表更新后小程序仍拿到旧值，
            # 导致耳号拼错）。部署后强制刷一次 *:sys_dict + *djs:dict* 缓存，让下次访问重读 DB。
            echo "==> Flushing dict cache (ruoyi sys_dict no-TTL; Flyway dict seeds bypass cache evict)"
            REDIS_PW="$(docker exec djs-redis-staging printenv REDIS_PASSWORD 2>/dev/null || true)"
            if [ -n "$REDIS_PW" ]; then
              REDIS_CONTAINER="djs-redis-staging" REDIS_PASSWORD="$REDIS_PW" bash script/sql/djs/_post-init.sh || true
            else
              echo "WARN: 读不到 djs-redis-staging 的 REDIS_PASSWORD，跳过字典缓存刷新" >&2
            fi

            echo "==> Container status:"
            DEPLOY_ENV=staging $COMPOSE ps
            echo "==> Last 80 lines of app log:"
            DEPLOY_ENV=staging $COMPOSE logs --tail=80 ruoyi-admin || true

            # 永远 exit 0：部署完成就算成功，健康状态自己 SSH 上去看
            exit 0
