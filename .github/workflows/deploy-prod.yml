name: Deploy Prod (Backend)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Trigger deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          command_timeout: 30m
          script: |
            set -e
            REPO_DIR=/opt/dongjiaoshan-prod
            COMPOSE="docker compose -f script/docker/docker-compose.deploy.yml"

            cd "$REPO_DIR"
            [ -f .env ] || { echo "ERROR: .env missing" >&2; exit 1; }

            echo "==> Pulling latest main branch"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Stopping old container to free memory for Maven build"
            DEPLOY_ENV=prod $COMPOSE stop ruoyi-admin || true

            echo "==> Building new image (multi-stage Maven build)"
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            DEPLOY_ENV=prod $COMPOSE build ruoyi-admin

            echo "==> Starting new container"
            DEPLOY_ENV=prod $COMPOSE up -d ruoyi-admin

            echo "==> Waiting for healthcheck..."
            for i in $(seq 1 36); do
              status=$(docker inspect -f '{{.State.Health.Status}}' djs-ruoyi-admin-prod 2>/dev/null || echo starting)
              echo "[$i] health=$status"
              [ "$status" = "healthy" ] && exit 0
              [ "$status" = "unhealthy" ] && { DEPLOY_ENV=prod $COMPOSE logs --tail=200 ruoyi-admin; exit 1; }
              sleep 5
            done
            DEPLOY_ENV=prod $COMPOSE logs --tail=200 ruoyi-admin
            exit 1
