name: Deploy Prod (Backend)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 冷构建（基础镜像缓存失效需重拉 + Maven 依赖）远超 30 分钟：2026-08-05 实测在
    # 1777s（29.6min）撞 command_timeout 被切断，`docker compose up -d` 那步从未执行 ——
    # 旧容器已停、新容器起不来，生产直接宕机，重试还会再撞一次，形成死循环。
    # 必须 command_timeout < timeout-minutes：让 ssh-action 先超时并回吐错误+部分日志，
    # 而不是被 GitHub 在 job 级硬杀（那样日志直接丢）。
    timeout-minutes: 120

    steps:
      - name: Trigger deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          command_timeout: 115m
          script: |
            set -e
            REPO_DIR=/www/wwwroot/api.dongjiaoshan.com
            COMPOSE="docker compose -f script/docker/docker-compose.deploy.yml"

            cd "$REPO_DIR"
            [ -f .env ] || { echo "ERROR: .env missing" >&2; exit 1; }

            echo "==> Pulling latest main branch"
            git fetch origin main
            git reset --hard origin/main

            # 构建期间**不停旧容器** —— 停机时长从「整个构建时长」降到「应用启动时间」。
            # 2026-08-06 staging 实测：停机 25s，构建全程服务可用（178 次探测仅切换那 10 次失败），
            # 构建期可用内存最低 565MB、未 OOM。
            # 更重要：`set -e` 下构建失败会直接退出，旧容器原封不动继续服务 ——
            # 2026-08-05 prod 宕机 1h40m 正是因为先 stop 再构建，构建卡死就把生产一起带走了。
            #
            # 原先要先 stop 是怕 4GB 内存不够（原注释 "free memory for Maven build"）。
            # 实测应用容器仅占 ~900MB，够用但无余量，且本机 swap=0（触顶即 OOM Kill）。
            # 故用 nice -n 19 压低构建优先级，并在构建前后打印内存水位便于复盘。
            # ⚠️ 若日后日志出现 OOM，优先加 swap 或降 MAVEN_OPTS 堆，不要退回「先 stop」。
            # 注：staging 那次是增量构建，全量构建内存压力更大，565MB 不可直接外推。
            echo "==> Memory before build"
            free -m | head -2

            echo "==> Building new image (old container keeps serving)"
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            nice -n 19 env DEPLOY_ENV=prod $COMPOSE build ruoyi-admin

            echo "==> Memory after build"
            free -m | head -2

            # 镜像 ID 变了，up -d 会自动重建容器（stop 旧 + start 新），无需显式 stop
            echo "==> Switching to new container"
            DEPLOY_ENV=prod $COMPOSE up -d ruoyi-admin

            echo "==> Brief wait for app to settle (60s)..."
            sleep 60

            echo "==> Best-effort smoke test (does NOT fail the deploy):"
            for i in $(seq 1 12); do
              if curl -s -o /dev/null --max-time 3 http://127.0.0.1:8080/; then
                echo "✅ Port 8080 responding at attempt $i"
                break
              fi
              echo "[$i] port not responding yet"
              sleep 5
            done

            # ruoyi 的 sys_dict 缓存无 TTL，只在 admin 改字典时主动 evict；Flyway 直接改 sys_dict_data
            # 绕过缓存失效 → 重启后 Redis 仍返旧字典快照（典型：品种/品系码表更新后小程序仍拿到旧值，
            # 导致耳号拼错）。部署后强制刷一次 *:sys_dict + *djs:dict* 缓存，让下次访问重读 DB。
            echo "==> Flushing dict cache (ruoyi sys_dict no-TTL; Flyway dict seeds bypass cache evict)"
            REDIS_PW="$(docker exec djs-redis-prod printenv REDIS_PASSWORD 2>/dev/null || true)"
            if [ -n "$REDIS_PW" ]; then
              REDIS_CONTAINER="djs-redis-prod" REDIS_PASSWORD="$REDIS_PW" bash script/sql/djs/_post-init.sh || true
            else
              echo "WARN: 读不到 djs-redis-prod 的 REDIS_PASSWORD，跳过字典缓存刷新" >&2
            fi

            echo "==> Container status:"
            DEPLOY_ENV=prod $COMPOSE ps
            echo "==> Last 80 lines of app log:"
            DEPLOY_ENV=prod $COMPOSE logs --tail=80 ruoyi-admin || true

            # 永远 exit 0：部署完成就算成功，健康状态自己 SSH 上去看
            exit 0
