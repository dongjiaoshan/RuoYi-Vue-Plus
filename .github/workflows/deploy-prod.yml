name: Deploy Prod (Backend)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Trigger deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          command_timeout: 30m
          script: |
            set -e
            REPO_DIR=/opt/dongjiaoshan-prod
            COMPOSE="docker compose -f script/docker/docker-compose.deploy.yml"

            cd "$REPO_DIR"
            [ -f .env ] || { echo "ERROR: .env missing" >&2; exit 1; }

            echo "==> Pulling latest main branch"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Stopping old container to free memory for Maven build"
            DEPLOY_ENV=prod $COMPOSE stop ruoyi-admin || true

            echo "==> Building new image (multi-stage Maven build)"
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            DEPLOY_ENV=prod $COMPOSE build ruoyi-admin

            echo "==> Starting new container"
            DEPLOY_ENV=prod $COMPOSE up -d ruoyi-admin

            echo "==> Waiting for app to respond on host:8080..."
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8080/actuator/health/liveness 2>/dev/null || echo 000)
              echo "[$i] http=$code"
              [ "$code" = "200" ] && { echo "✅ App is alive"; exit 0; }
              if [ "$code" = "404" ]; then
                code2=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8080/actuator/health 2>/dev/null || echo 000)
                [ "$code2" = "200" ] && { echo "✅ App is up (no liveness probe, used /actuator/health)"; exit 0; }
              fi
              sleep 5
            done
            echo "❌ Health check timed out, dumping logs"
            DEPLOY_ENV=prod $COMPOSE logs --tail=200 ruoyi-admin
            exit 1
