name: Deploy Prod (Backend)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

env:
  REMOTE_DIR: /opt/dongjiaoshan-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar
        run: mvn -B -DskipTests -pl ruoyi-admin -am clean package

      - name: Stage deploy bundle
        run: |
          mkdir deploy
          cp ruoyi-admin/target/ruoyi-admin.jar deploy/
          cp Dockerfile deploy/
          cp script/docker/docker-compose.deploy.yml deploy/docker-compose.yml

      - name: Upload bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          source: "deploy/*"
          target: ${{ env.REMOTE_DIR }}
          strip_components: 1

      - name: Restart container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          script: |
            set -e
            cd /opt/dongjiaoshan-prod
            [ -f .env ] || { echo "ERROR: .env missing" >&2; exit 1; }
            DEPLOY_ENV=prod docker compose up -d --build
            echo "Waiting for healthcheck..."
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' djs-ruoyi-admin-prod 2>/dev/null || echo starting)
              echo "[$i] health=$status"
              [ "$status" = "healthy" ] && exit 0
              [ "$status" = "unhealthy" ] && { docker compose logs --tail=200 ruoyi-admin; exit 1; }
              sleep 5
            done
            docker compose logs --tail=200 ruoyi-admin
            exit 1
