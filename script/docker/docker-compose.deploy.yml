services:
  ruoyi-admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: dongjiaoshan/ruoyi-admin:${DEPLOY_ENV:?DEPLOY_ENV is required}
    container_name: djs-ruoyi-admin-${DEPLOY_ENV:?}
    restart: unless-stopped
    # 共享宿主网络栈：容器内 127.0.0.1:6379 直连宿主上的 Redis；
    # 应用 8080 直接占用宿主 8080，因此不需要 ports 映射。
    network_mode: host
    env_file:
      - ./.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
