# 本地开发数据栈（macOS / Apple Silicon 友好）
# - 仅包含 MySQL + Redis + MinIO，业务后端用 IDEA 直接跑
# - 不使用 network_mode: host（Mac 不支持），改为端口映射
# - 数据走 named volume，重置只需 `docker compose down -v`
# - 账号密码与 ruoyi-admin/src/main/resources/application-dev.yml 默认值对齐，请勿改

services:
  mysql:
    image: mysql:8.0
    container_name: dev-mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ry-vue
    ports:
      - "3306:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --init-connect=SET NAMES utf8mb4
      - --skip-character-set-client-handshake
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
    volumes:
      - dev-mysql-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7.2.8
    container_name: dev-redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    command: redis-server --requirepass "ruoyi123" --appendonly yes
    volumes:
      - dev-redis-data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: dev-minio
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ruoyi
      MINIO_ROOT_PASSWORD: ruoyi123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server --address ':9000' --console-address ':9001' /data
    volumes:
      - dev-minio-data:/data
    restart: unless-stopped

volumes:
  dev-mysql-data:
  dev-redis-data:
  dev-minio-data:
