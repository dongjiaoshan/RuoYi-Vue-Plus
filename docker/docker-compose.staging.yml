services:
  ruoyi-admin:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dongjiaoshan/ruoyi-admin:staging
    container_name: djs-ruoyi-admin-staging
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - ../logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
