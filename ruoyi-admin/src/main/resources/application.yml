# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: 1GB
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256

captcha:
  # 是否启用验证码校验
  enable: true
  # 验证码类型 math 数组计算 char 字符验证
  type: math
  # 数字验证码位数
  numberLength: 1
  # 字符验证码长度
  charLength: 4

# 日志配置
logging:
  level:
    org.dromara: @logging.level@
    org.springframework: warn
    org.mybatis.spring.mapper: error
    org.apache.fury: warn
  config: classpath:logback-plus.xml

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  application:
    name: RuoYi-Vue-Plus
  threads:
    # 开启虚拟线程 仅jdk21可用
    virtual:
      enabled: false
  task:
    execution:
      # 从 springboot 3.5 开始 spring自带线程池
      # 不再需要 AsyncConfig与ThreadPoolConfig 可直接注入线程池使用
      thread-name-prefix: async-
      # 由spring自己初始化线程池
      mode: force
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: @profiles.active@
  # Flyway DB migration —— 只管业务 SQL（classpath:db/migration/V*__*.sql）
  # ruoyi 自带 ry_vue_5.X.sql / ry_job.sql / ry_workflow.sql 仍按 quickstart 手工导入。
  # 已部署环境（dev/staging）：首次启动时 baseline-on-migrate 会创建 flyway_schema_history 表
  # 并把 baseline-version 之前的 SQL 全部标记为已应用，避免重跑。
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true
    # baseline-version = 当前已部署的最大 V<version>（D04 HOTFIX V202605281100）。
    # 后续新增 SQL 时间戳必须 > 该值（建议直接用当天 yyyyMMddHHmm），否则会被视为
    # baseline 之前已应用而跳过。每次升 baseline 都需要所有部署环境同步升级。
    baseline-version: 202605281100
    baseline-description: dongjiaoshan v1 baseline (D04 closing snapshot)
    validate-on-migrate: true
    # 严格顺序 —— 不允许跳号或乱序补挂
    out-of-order: false
    # SQL 注释里的 ${...} 别被 flyway 当占位符替换（业务 SQL 没用占位符）
    placeholder-replacement: false
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  mvc:
    # 设置静态资源路径 防止所有请求都去查静态资源
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # jwt秘钥
  jwt-secret-key: abcdefghijklmnopqrstuvwxyz

# security配置
security:
  # 排除路径
  excludes:
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    - /favicon.ico
    - /error
    - /*/api-docs
    - /*/api-docs/**
    - /warm-flow-ui/config

# 多租户配置
tenant:
  # 是否开启
  enable: true
  # 排除表
  excludes:
    - sys_menu
    - sys_tenant
    - sys_tenant_package
    - sys_role_dept
    - sys_role_menu
    - sys_user_post
    - sys_user_role
    - sys_client
    - sys_oss_config
    - flow_spel
    - sys_farm
    - mp_subscribe_record

# 门店行级数据隔离（STORE-PERM-001）—— 白名单（opt-in）：仅以下表会被注入 WHERE store_id=?
# 空上下文 / 非白名单表 / 超管租管 一律不过滤，详见 StoreLineHandler。
store:
  includes:
    - t_store_daily_ledger
    - t_store_inventory
    - t_store_member
    - t_store_member_consumption
    - t_store_product_relation
    - t_store_return
    - t_store_sale_record
    - t_warehouse_demand_manage
    - t_warehouse_product_inhouse

# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 自定义配置 是否全局开启逻辑删除 关闭后 所有逻辑删除功能将失效
  enableLogicDelete: true
  # 多包名使用 例如 org.dromara.**.mapper,org.xxx.**.mapper
  mapperPackage: org.dromara.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: org.dromara.**.domain
  global-config:
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 如需改为自增 需要将数据库表全部设置为自增
      idType: ASSIGN_ID

# 数据加密
mybatis-encryptor:
  # 是否开启加密
  enable: false
  # 默认加密算法
  algorithm: BASE64
  # 编码方式 BASE64/HEX。默认BASE64
  encode: BASE64
  # 安全秘钥 对称算法的秘钥 如：AES，SM4
  password:
  # 公私钥 非对称算法的公私钥 如：SM2，RSA
  publicKey:
  privateKey:

# api接口加密
api-decrypt:
  # 是否开启全局接口加密
  enabled: true
  # AES 加密头标识
  headerFlag: encrypt-key
  # 响应加密公钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
  # 对应前端解密私钥 
  publicKey: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAJnNwrj4hi/y3CCJu868ghCG5dUj8wZK++RNlTLcXoMmdZWEQ/u02RgD5LyLAXGjLOjbMtC+/J9qofpSGTKSx/MCAwEAAQ==
  # 请求解密私钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
  # 对应前端加密公钥 MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAKoR8mX0rGKLqzcWmOzbfj64K8ZIgOdHnzkXSOVOZbFu/TJhZ7rFAN+eaGkl3C4buccQd/EjEsj9ir7ijT7h96MCAwEAAQ==
  privateKey: 

springdoc:
  api-docs:
    # 是否开启接口文档
    enabled: true
  info:
    # 标题
    title: '标题：RuoYi-Vue-Plus多租户管理系统_接口文档'
    # 描述
    description: '描述：用于管理集团旗下公司的人员信息,具体包括XXX,XXX模块...'
    # 版本
    version: '版本号: ${project.version}'
    # 作者信息
    contact:
      name: Lion Li
      email: crazylionli@163.com
      url: https://gitee.com/dromara/RuoYi-Vue-Plus
  #这里定义了两个分组，可定义多个，也可以不定义
  group-configs:
    - group: 1.演示模块
      packages-to-scan: org.dromara.demo
    - group: 2.通用模块
      packages-to-scan: org.dromara.web
    - group: 3.系统模块
      packages-to-scan: org.dromara.system
    - group: 4.代码生成模块
      packages-to-scan: org.dromara.generator
    - group: 5.工作流模块
      packages-to-scan: org.dromara.workflow

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接
  excludeUrls:
    - /system/notice

--- # 分布式锁 lock4j 全局配置
lock4j:
  # 获取分布式锁超时时间，默认为 3000 毫秒
  acquire-timeout: 3000
  # 分布式锁的超时时间，默认为 30 秒
  expire: 30000

--- # Actuator 监控端点的配置项
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/sys-console.log

--- # 默认/推荐使用sse推送
sse:
  enabled: true
  path: /resource/sse

--- # websocket
websocket:
  # 如果关闭 需要和前端开关一起关闭
  enabled: false
  # 路径
  path: /resource/websocket
  # 设置访问源地址
  allowedOrigins: '*'

--- # warm-flow工作流配置
warm-flow:
  # 是否开启工作流，默认true
  enabled: true
  # 是否开启设计器ui
  ui: true
  # 是否显示流程图顶部文字
  top-text-show: true
  # 是否渲染节点悬浮提示，默认true
  node-tooltip: true
  # 默认Authorization，如果有多个token，用逗号分隔
  token-name: ${sa-token.token-name},clientid

--- # 东角山业务配置（V1 多农场 disabled / OSS STS / 业务编码生成器 / 微信集成）
djs:
  security:
    # API 鉴权全局开关（Kevin 2026-07-08 拍板）。V1 权限靠 admin 菜单 / mp tab 的显示隐藏控制，
    # 后端 API 不做细粒度 @SaCheckPermission 校验。
    #   false（默认）→ 所有 @SaCheckPermission 放行（仍需登录），权限只由前端菜单可见性控制
    #   true  → 恢复 ruoyi 原生按菜单权限精确校验（可随时回退）
    # 只影响服务端 API 拦截，不影响 getInfo 下发给前端的 permissions（mp tab / admin 按钮显隐不受影响）。
    api-permission-check: ${DJS_API_PERM_CHECK:false}
  multi-farm:
    # V1 disabled，V2 启用拦截器后多农场生效（SYS-INFRA-007）
    enabled: false
  schedule:
    # djs 业务统计定时任务总开关（Spring @Scheduled 单机跑，独立于 snail-job 调度中心）。
    # 默认 true；置 false 整体停掉养殖/仓库统计聚合 + 有机证书预警 job。详见 DjsSchedulingConfig。
    enabled: ${DJS_SCHEDULE_ENABLED:true}
    # 养殖统计聚合 cron（日→月→年 UPSERT），每日 0:00 跑 T-1（邓博 row9：每晚12点）。
    breed-aggregate-cron: 0 0 0 * * ?
    # 仓库统计聚合 cron（日/作物日/月 UPSERT），每日 0:00 跑 T-1。
    warehouse-stat-cron: 0 0 0 * * ?
    # 有机证书到期预警扫描 cron（PLT-MD-003），每日 0:00。
    organic-warning-cron: 0 0 0 * * ?
  applet:
    # 小程序 mock 账号密码登录开关（dev 多角色快速登录 9 角色按钮依赖它）。
    # dev 默认 true；上生产前置 false（或设环境变量 DJS_APPLET_AUTH_MOCK=false），
    # mock 账号登录端点返 40004，仅留真微信登录。详见 doc/_adr/0003-mp-mock-auth.md。
    auth-mock-enabled: ${DJS_APPLET_AUTH_MOCK:true}
  oss-sts:
    # 阿里云 OSS STS Token 服务（SYS-INFRA-002）
    enabled: true
    region: cn-hangzhou
  encoder:
    # 业务编码生成器（SYS-INFRA-004）
    ear-no:
      # 耳号生成器预留天数：超过此天数未使用的预占耳号回收
      reserve-days: 90
  wechat:
    # 微信小程序集成（SYS-AUTH-001 登录 + SYS-INFRA-006 订阅消息推送）
    miniapp:
      # AppID："mock" 表示 dev 阶段不调微信真实 API（登录走 mock openid，推送走 mock 日志）
      app-id: ${WX_MA_APPID:mock}
      secret: ${WX_MA_SECRET:}
      # 显式 mock 开关；app-id=mock 时强制为 mock（取或运算）
      mock: ${WX_MA_MOCK:true}
      # 4 类订阅消息模板 ID（V1 占位空字符串，运维填入真实模板 ID 后生效）
      templates:
        slaughter_notice: ""
        stock_alert: ""
        sales_summary: ""
        internal_feedback: ""
      # 推送失败重试策略（指数退避，含首次共尝试 max-attempts 次）
      retry:
        max-attempts: 3
        initial-backoff-ms: 500
        backoff-multiplier: 2.0
